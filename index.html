<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBF HELIOS & SWAF & InaFLEWS - Multi-Hazard Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Header Utama di Tengah Atas */
        .map-header {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); padding: 12px 20px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center; z-index: 1000; min-width: 420px;
        }
        .map-header h3 { margin: 0; font-size: 11px; font-weight: bold; color: #555; }
        .map-header h1 { margin: 3px 0; font-size: 15px; font-weight: bold; color: #111; }
        .map-header p { margin: 2px 0 6px 0; font-size: 12px; color: darkred; font-weight: bold; }

        /* Logo di Ujung Kanan Atas */
        .logo-container {
            position: absolute; top: 15px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 8px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo-instansi { width: 45px; height: auto; display: block; }

        /* Dropdown Menu (Hide Button Style) di Kanan Atas (Di bawah Logo) */
        .top-right-controls {
            position: absolute; top: 75px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
        }
        .dropdown-wrapper { position: relative; display: inline-block; }
        .dropdown-btn {
            background: #2c3e50; color: white; border: none; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .dropdown-btn:hover { background: #34495e; }
        .dropdown-content {
            display: none; position: absolute; right: 0; background-color: #fff;
            min-width: 200px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            border-radius: 6px; z-index: 1001; overflow: hidden; margin-top: 4px;
        }
        .dropdown-content button {
            color: black; padding: 10px 14px; text-align: left; background: none;
            border: none; width: 100%; cursor: pointer; font-size: 11px; font-weight: bold;
            border-bottom: 1px solid #eee; display: block;
        }
        .dropdown-content button:hover { background-color: #f1f1f1; }
        .dropdown-wrapper.active .dropdown-content { display: block; }

        /* Kontrol Waktu & Legenda di Kiri Bawah */
        .control-box {
            position: absolute; bottom: 30px; left: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-width: 320px;
        }
        .control-box h4 { margin: 0 0 8px 0; font-size: 13px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
        
        .time-controls { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .button-group { display: flex; gap: 4px; justify-content: space-between; }
        .time-btn {
            flex: 1; background: #f0f0f0; border: 1px solid #ccc; padding: 6px 4px; 
            cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold; text-align: center;
        }
        .time-btn:hover { background: #e0e0e0; }
        .time-btn.active { background: #1E90FF; color: white; border-color: #0d6efd; }
        
        .nav-playback-group { display: flex; gap: 5px; margin-top: 4px; }
        .action-btn {
            flex: 1; background: #333; color: white; border: none; padding: 6px; 
            cursor: pointer; border-radius: 4px; font-size: 11px; font-weight: bold;
        }
        .action-btn:hover { background: #444; }
        .action-btn.playing { background: #dc3545; }

        .legend-container { margin-top: 8px; max-height: 180px; overflow-y: auto; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; font-size: 11px; }
        .legend-color { width: 18px; height: 12px; margin-right: 8px; border: 1px solid #777; flex-shrink: 0; }

        .dev-watermark {
            position: absolute; bottom: 15px; right: 20px; z-index: 1000;
            background: rgba(255, 255, 255, 0.85); padding: 6px 12px;
            border-radius: 4px; font-size: 11px; color: #333; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- Header Utama dengan Struktur Judul Standar Instansi -->
    <div class="map-header">
        <h3 id="systemSubtitle">IBF SWAF : Severe Wind Alert Forecast</h3>
        <h1 id="hazardTitle">Prediksi Risiko Dampak Angin Kencang Wilayah BBMKG IV</h1>
        <p id="validDateText">Valid: Memuat data...</p>
    </div>

    <!-- Logo di Ujung Kanan Atas -->
    <div class="logo-container">
        <img src="logo_bmkg.png" alt="Logo BMKG" class="logo-instansi" onerror="this.style.display='none'">
    </div>

    <!-- Tombol Dropdown (Map Settings & Daftar Risiko) di Kanan Atas -->
    <div class="top-right-controls">
        <!-- Map Settings Dropdown -->
        <div class="dropdown-wrapper" id="mapSettingsDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('mapSettingsDropdown')">🗺️ Map Settings ▾</button>
            <div class="dropdown-content">
                <button onclick="changeBasemap('dark')">Dark Matter (Gelap)</button>
                <button onclick="changeBasemap('streets')">OpenStreetMap (Standar)</button>
                <button onclick="changeBasemap('positron')">CartoDB Positron (Terang)</button>
            </div>
        </div>

        <!-- Daftar Risiko Bencana Dropdown -->
        <div class="dropdown-wrapper" id="riskDropdown">
            <button class="dropdown-btn" onclick="toggleDropdown('riskDropdown')">⚠️ Daftar Risiko Dampak Bencana ▾</button>
            <div class="dropdown-content">
                <button onclick="switchHazard('banjir')">Risiko Dampak Banjir</button>
                <button onclick="switchHazard('longsor')">Risiko Dampak Longsor</button>
                <button onclick="switchHazard('angin')">Risiko Dampak Angin Kencang</button>
                <button onclick="switchHazard('suhu')">Risiko Dampak Udara Panas</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <div class="control-box">
        <h4>Navigasi Waktu Prediksi</h4>
        <div class="time-controls">
            <div class="button-group" id="dayButtonsContainer"></div>
            <div class="nav-playback-group">
                <button class="action-btn" onclick="prevStep()">&laquo; Prev</button>
                <button class="action-btn" id="playBtn" onclick="togglePlay()">&#9658; Play</button>
                <button class="action-btn" onclick="nextStep()">Next &raquo;</button>
            </div>
        </div>

        <h4>Legenda Peringatan</h4>
        <div id="legendBox" class="legend-container"></div>
    </div>

    <div class="dev-watermark">Pengembang Bagus Primohadi - BBMKG IV</div>

    <script>
        var map = L.map('map').setView([-1.75, 125.25], 5);

        // Pengaturan Basemap
        var currentBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        function changeBasemap(type) {
            map.removeLayer(currentBasemap);
            if (type === 'dark') {
                currentBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' });
            } else if (type === 'streets') {
                currentBasemap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' });
            } else if (type === 'positron') {
                currentBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' });
            }
            currentBasemap.addTo(map);
            closeAllDropdowns();
        }

        // Fungsi Toggle Dropdown
        function toggleDropdown(id) {
            let el = document.getElementById(id);
            let isOpen = el.classList.contains('active');
            closeAllDropdowns();
            if (!isOpen) el.classList.add('active');
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-wrapper').forEach(w => w.classList.remove('active'));
        }

        // Tutup dropdown jika klik di luar
        window.onclick = function(event) {
            if (!event.target.matches('.dropdown-btn')) {
                closeAllDropdowns();
            }
        }

        // 5. BATAS ADMINISTRASI (Kabupaten & Provinsi dengan Ketebalan Berbeda)
        fetch('admin_provinsi.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: "#ffffff", weight: 2.0, fillColor: "transparent", fillOpacity: 0 }
                }).addTo(map);
            })
            .catch(err => console.log("Batas provinsi belum dimuat"));

        fetch('admin_kabupaten.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: { color: "#ffcc00", weight: 0.8, fillColor: "transparent", fillOpacity: 0 },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties && feature.properties.WADMKK) {
                            layer.bindTooltip(feature.properties.WADMKK, {sticky: true});
                        }
                    }
                }).addTo(map);
            })
            .catch(err => console.log("Batas kabupaten belum dimuat"));

        // KONFIGURASI 4 VARIABEL SESUAI TEMPLAT STRUKTUR JUDUL RESMI
        const hazardConfig = {
            banjir: {
                subtitle: "IBF InaFLEWS : Indonesia Flood Early Warning System",
                title: "Prediksi Risiko Dampak Banjir Wilayah BBMKG IV",
                prefix: "banjir_day_",
                metaFile: "metadata_banjir.json",
                legends: [{ color: "#0000FF", label: "Potensi Banjir" }]
            },
            longsor: {
                subtitle: "IBF InaFLEWS : Indonesia Flood Early Warning System",
                title: "Prediksi Risiko Dampak Longsor Wilayah BBMKG IV",
                prefix: "longsor_day_",
                metaFile: "metadata_longsor.json",
                legends: [{ color: "#8B4513", label: "Potensi Longsor" }]
            },
            angin: {
                subtitle: "IBF SWAF : Severe Wind Alert Forecast",
                title: "Prediksi Risiko Dampak Angin Kencang Wilayah BBMKG IV",
                prefix: "angin_day_",
                metaFile: "metadata_angin.json",
                legends: [
                    { color: "#E0B0FF", label: "Waspada Dampak Angin Cuaca Badai" },
                    { color: "#BA55D3", label: "Siaga Dampak Angin Cuaca Badai" },
                    { color: "#800080", label: "Awas Dampak Angin Cuaca Badai" },
                    { color: "#87CEFA", label: "Waspada Dampak Angin Cuaca Cerah" },
                    { color: "#1E90FF", label: "Siaga Dampak Angin Cuaca Cerah" },
                    { color: "#00008B", label: "Awas Dampak Angin Cuaca Cerah" },
                    { color: "#DEB887", label: "Waspada Dampak Angin Cuaca Hybrid" },
                    { color: "#A0522D", label: "Siaga Dampak Angin Cuaca Hybrid" },
                    { color: "#5C4033", label: "Awas Dampak Angin Cuaca Hybrid" }
                ]
            },
            suhu: {
                subtitle: "IBF HELIOS : Heat Extreme Level Indicator System",
                title: "Prediksi Risiko Dampak Udara Panas Wilayah BBMKG IV",
                prefix: "at_disc_day_",
                metaFile: "metadata_at_disc.json",
                legends: [
                    { color: "#00FF00", label: "Nyaman / Tidak Ada Potensi" },
                    { color: "#FFFF00", label: "Waspada Dampak Udara Panas" },
                    { color: "#FFA500", label: "Siaga Dampak Udara Panas" },
                    { color: "#FF0000", label: "Awas Dampak Udara Panas" }
                ]
            }
        };

        var currentHazard = 'angin';
        var imageLayers = [];
        var currentIndex = 0;
        var validDates = [];
        var hazardBounds = null;
        var playInterval = null;
        var isPlaying = false;

        function switchHazard(hazardKey) {
            stopPlay();
            currentHazard = hazardKey;
            closeAllDropdowns();
            
            // Set Judul Sesuai Templat Resmi
            document.getElementById('systemSubtitle').innerText = hazardConfig[hazardKey].subtitle;
            document.getElementById('hazardTitle').innerText = hazardConfig[hazardKey].title;
            renderLegend(hazardKey);
            
            imageLayers.forEach(layer => map.removeLayer(layer));
            imageLayers = [];
            
            loadHazardData(hazardKey);
        }

        function renderLegend(hazardKey) {
            let container = document.getElementById('legendBox');
            container.innerHTML = "";
            hazardConfig[hazardKey].legends.forEach(item => {
                container.innerHTML += `
                    <div class="legend-item">
                        <div class="legend-color" style="background:${item.color};"></div> 
                        ${item.label}
                    </div>`;
            });
        }

        function loadHazardData(hazardKey) {
            let config = hazardConfig[hazardKey];
            var uniqueInit = new Date().getTime();

            document.getElementById('validDateText').innerText = "Valid: Memuat data...";

            fetch(config.metaFile + '?v=' + uniqueInit)
                .then(res => res.json())
                .then(data => {
                    validDates = data.dates;
                    hazardBounds = data.bounds || [[-8.505, 114.995], [5.005, 135.505]];
                    
                    const btnContainer = document.getElementById('dayButtonsContainer');
                    btnContainer.innerHTML = "";
                    
                    for (let i = 0; i < validDates.length; i++) {
                        let imgUrl = `${config.prefix}${i}.png?v=${uniqueInit}`;
                        let overlay = L.imageOverlay(imgUrl, hazardBounds, { opacity: 0, interactive: false }).addTo(map);
                        imageLayers.push(overlay);

                        let btn = document.createElement('button');
                        btn.className = 'time-btn';
                        btn.id = 'day-btn-' + i;
                        btn.innerText = 'H+' + (i + 1);
                        btn.onclick = function() { stopPlay(); loadDay(i); };
                        btnContainer.appendChild(btn);
                    }
                    loadDay(0);
                })
                .catch(err => {
                    validDates = [];
                    document.getElementById('validDateText').innerText = "⚠️ Data Belum Tersedia";
                    const btnContainer = document.getElementById('dayButtonsContainer');
                    btnContainer.innerHTML = "<span style='font-size:11px; color:#d9534f; font-weight:bold;'>Data belum diunggah ke server.</span>";
                    imageLayers.forEach(layer => map.removeLayer(layer));
                    imageLayers = [];
                });
        }

        // Format tanggal Indonesia: Senin, 28 Juli 2026
        function formatIndoDate(dateStr) {
            let options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        }

        function loadDay(index) {
            if(validDates.length === 0) return;
            currentIndex = index;
            for (let i = 0; i < imageLayers.length; i++) {
                if (i === index) {
                    imageLayers[i].setOpacity(0.85); 
                } else {
                    imageLayers[i].setOpacity(0);
                }
            }
            for (let i = 0; i < validDates.length; i++) {
                let btn = document.getElementById('day-btn-' + i);
                if (btn) btn.classList.toggle('active', i === index);
            }
            document.getElementById('validDateText').innerText = `Valid: ${formatIndoDate(validDates[index])}`;
        }

        function nextStep() { if(validDates.length>0) loadDay((currentIndex + 1) % validDates.length); }
        function prevStep() { if(validDates.length>0) loadDay((currentIndex - 1 + validDates.length) % validDates.length); }
        function togglePlay() { if(validDates.length>0) isPlaying ? stopPlay() : startPlay(); }
        function startPlay() {
            isPlaying = true;
            let btn = document.getElementById('playBtn');
            btn.innerText = '❚❚ Pause';
            btn.classList.add('playing');
            playInterval = setInterval(nextStep, 1000);
        }
        function stopPlay() {
            isPlaying = false;
            let btn = document.getElementById('playBtn');
            btn.innerText = '► Play';
            btn.classList.remove('playing');
            if (playInterval) clearInterval(playInterval);
        }

        // Inisialisasi awal default membuka Angin Kencang
        switchHazard('angin');
    </script>
</body>
</html>
